<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>C3 Site Finder · EV Edison</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Apply the saved theme before first paint (default: light) to avoid a flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('njtc-theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' || t === 'light' ? t : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
